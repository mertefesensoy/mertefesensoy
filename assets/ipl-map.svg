<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="ipl-title ipl-desc" class="ipl" focusable="false">
<title id="ipl-title">IPL of Mert Efe Şensoy's systems</title>
<desc id="ipl-desc">A stylised mainframe console loads six subsystems, one line each with a status light and an honest note: FlyBatch UP (v0.5.1-rc.1 · TESTERS: No IBM Z hardware yet: MVS 3.8j under Hercules, s390x under QEMU); SuperconducTED RESEARCH (RESEARCH PREVIEW: Cycle 1 pipeline validated; trained memberships are cycle 2); Cassandra Collective RESEARCH (STAGE 0 · NEGATIVE: Chorus Stage 0 closed as a published negative result; replanning); Open Memory Initiative UP (ACTIVE DEVELOPMENT: Schematic-stage work; claims never run ahead of validation); spdr UP (v0.1.1 · crates.io: UDIMM complete; SODIMM, RDIMM, LRDIMM wait for real fixtures); Ephesus PRE-ALPHA (PRE-ALPHA: No releases and no installer; everything runs from source today). IPL complete, 3 UP · 2 RESEARCH · 1 PRE-ALPHA.</desc>
